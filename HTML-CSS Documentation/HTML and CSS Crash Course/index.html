<!DOCTYPE html>
<html>

<head>
    <title>Learning HTML</title>
</head>

<body>


    <div> <!-- Divisions are used for styling purposes, no actual use by itself -->
        <p>Test, <strong>Amongus</strong></p>
        <p>My First Website <em>Not</em> Page!</p>
        <a href="about.html">About me Page</a>
    </div>
    
    <div>
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>
        <h4>Heading 4</h4>

        <p>Paragraph</p>
    </div>

    <!--Div - Division - Divide Contents -->
    <div>
        <!--OL = Ordered List (numbers), UL = Unordered List (Bullets)-->
        <h3>Unordered List (UL)</h3>
        <ol>
            <li>Amongus</li>
            <li>Amonging</li>
            <li>Gunggus</li>
        </ol>
    </div>

    <span>
        I am a <br> <!-- Break Line --> span tag
    </span> <!-- Like a paragraph, a way to add CSS / JS hook -->


    <!-- Attributes -->
     <img src="img/GreenDayLogo.png" alt="A picture of Green Day Logo">
     <!-- Alt is for readability and accessibility-->

    <!-- Anchor Tags -->
     <a href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWdl8yUdbXu9k4XazFQ9XfpXyVnkCwXco1jxYldDo0qA&s=10">Green Day Image</a>

    <!-- Blockquote - Quoting from anothger website-->
     <blockquote cite="http://youtube.com">
        Amonging gunggus, really really gunggus.
     </blockquote>

    <p style="color:orange">Style me :D</p>
</body>
</html>
